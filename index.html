<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Носки в суде</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c2942;--pan:#2b3b5c;--ink:#f4efe6;--gold:#f2b33d;--red:#e4572e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Rubik,system-ui,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:12px 0 24px}
h1{font-weight:800;font-size:28px;margin:10px 0}
canvas{width:100%;aspect-ratio:3/2;border-radius:14px;display:block}
button,input{font:inherit;border-radius:12px;border:0;padding:12px 16px}
button{background:var(--gold);color:#1c2942;font-weight:800;cursor:pointer}
button.alt{background:var(--pan);color:var(--ink)}
button:disabled{opacity:.4}
input{background:var(--pan);color:var(--ink);width:100%}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}
.row2{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.card{background:var(--pan);border-radius:12px;padding:12px;margin:8px 0}
.hand button{display:block;text-align:left;width:100%;background:#f7f3ff;font-weight:500;margin-top:8px}
.obj{background:var(--red);color:#fff;font-size:20px;width:100%;margin:4px 0 8px}
.chip{display:inline-block;margin:2px 6px 2px 0;padding:4px 12px;border-radius:99px;color:#1c2942;font-weight:800}
small{opacity:.75}
</style></head><body><main>
<canvas id="cv" width="720" height="480"></canvas><div id="ui"></div></main>
<script>
const $=s=>document.querySelector(s),app=$('#ui'),cv=$('#cv'),cx=cv.getContext('2d');
const sid=localStorage.sid||(localStorage.sid=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()));
let ws,S=null,want=null,objAt=0,objBy='',err='';
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>(S.players.find(p=>p.id==id)||{}).name||'';
const tx=(t,o)=>ws.send(JSON.stringify({t,...o}));
function connect(create){ws=new WebSocket(location.origin.replace(/^http/,'ws'));
 ws.onopen=()=>ws.send(JSON.stringify({t:'join',room:want.room,name:want.name,id:sid,create}));
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t=='s'){S=m.s;err='';history.replaceState(0,'','?r='+S.code);render()}
  if(m.t=='err'){err=m.e;want=null;S=null;ws.close();render()}
  if(m.t=='obj'){objAt=Date.now();objBy=nm(m.by)}};
 ws.onclose=()=>{if(want)setTimeout(()=>connect(false),1500)}}
setInterval(()=>ws&&ws.readyState==1&&ws.send('{"t":"ping"}'),25000);
function home(){const r=(new URLSearchParams(location.search).get('r')||'').toUpperCase();
 app.innerHTML=`<h1>Носки в суде</h1><p>Суд над носками для 2–6 друзей. Вход по ссылке, без регистрации.</p>
 ${err?`<div class=card>${E(err)}</div>`:''}
 <input id=nm maxlength=14 placeholder="Твоё имя" value="${E(localStorage.nm||'')}">
 ${r?`<div class=row><button id=jn>Войти в комнату ${E(r)}</button></div>`
 :`<div class=row><button id=mk>Создать комнату</button></div><div class=row><input id=cd maxlength=5 placeholder="Код комнаты"><button class=alt id=jn>Войти</button></div>`}`;
 const go=(room,create)=>{const name=$('#nm').value.trim()||'Носок';localStorage.nm=name;want={room,name};connect(create)};
 if($('#mk'))$('#mk').onclick=()=>go(Math.random().toString(36).slice(2,7).toUpperCase(),true);
 $('#jn').onclick=()=>{const c=$('#cd')?$('#cd').value:r;if(c)go(c,false)}}
const chip=p=>`<span class=chip style="background:${p.color}">${E(p.name)}${p.on?'':' 💤'}</span>`;
const board=()=>`<div class=card>${[...S.players].sort((a,b)=>b.score-a.score).map(p=>`<div class=row2>${chip(p)}<b>${p.score}</b></div>`).join('')}</div>`;
function render(){
 if(!S)return home();
 const me=S.me,R=S.roles,host=S.host==me,L=S.phase,mr=R.pro==me?'прокурор':R.def==me?'адвокат':R.judge==me?'судья':'присяжный';let h='';
 if(L=='lobby')h=`<h1>Комната ${S.code}</h1><div class=card>Отправь друзьям ссылку:<div class=row><button id=cp>Поделиться ссылкой</button></div></div>
  <div class=card>${S.players.map(chip).join('')}<br><small>${S.n} из 6 игроков, нужно минимум 2</small></div>
  ${host?`<button id=st ${S.n<2?'disabled':''}>Начать суд</button>`:'<small>Ждём, пока хозяин комнаты начнёт игру</small>'}`;
 else if(L=='end'){const w=[...S.players].sort((a,b)=>b.score-a.score)[0];h=`<h1>Победитель: ${E(w.name)}</h1>${board()}${host?'<button id=ag>Сыграть ещё</button>':''}`}
 else{const sp=S.turn%2?R.def:R.pro,pd=S.pending;
  h=`<div class=card><b>Дело:</b> ${E(S.case)}<br><small>Раунд ${S.round+1} из ${S.n}. Ты — ${mr}</small></div>`;
  if(L=='trial'){
   h+=pd?(R.judge==me?`<div class=card>Принять довод?<div class=row><button id=ok>Принять</button><button class=alt id=no>Отклонить</button></div></div>`:`<div class=card><small>Судья решает…</small></div>`)
   :sp==me?`<div class="card hand">Твой ход, выбери довод:${S.hand.map((c,i)=>`<button data-i=${i}>${E(c.t)}</button>`).join('')}</div>`
   :`<div class=card><small>Говорит ${E(nm(sp))}…</small></div>`;
   h+=`<button class=obj id=ob>ПРОТЕСТУЮ!</button>`}
  if(L=='vote')h+=S.voters.includes(me)&&!S.voted.includes(me)?`<div class=card>Твой вердикт?<div class=row><button id=g>Виновен</button><button class=alt id=n>Невиновен</button></div></div>`:`<div class=card><small>Голосуют: ${S.voted.length} из ${S.voters.length}</small></div>`;
  if(L=='verdict'){const v=S.verdict;h+=`<div class=card><b>${v.guilty?'Виновен':'Невиновен'}</b> <small>${v.g+v.n?`голоса ${v.g}:${v.n}`:'решили доводы'}</small></div>${board()}${host?`<button id=nx>${S.round+1>=S.n?'Итоги':'Следующее дело'}</button>`:''}`}
  h+=S.played.map(c=>`<div><small>${c.ok?'✓':'✗'} ${E(nm(c.by))}: ${E(c.t)}</small></div>`).join('');
  if(host&&(L=='trial'||L=='vote'))h+=`<p><button class=alt id=sk>Пропустить (если кто-то завис)</button></p>`}
 app.innerHTML=h;
 const b=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
 b('st',()=>tx('begin'));b('ok',()=>tx('rule',{ok:1}));b('no',()=>tx('rule',{ok:0}));b('g',()=>tx('vote',{g:1}));b('n',()=>tx('vote',{g:0}));
 b('nx',()=>tx('next'));b('ag',()=>tx('again'));b('ob',()=>tx('obj'));b('sk',()=>tx('skip'));
 b('cp',e=>{const u=location.origin+'/?r='+S.code;(navigator.share?navigator.share({title:'Носки в суде',url:u}):navigator.clipboard.writeText(u)).then(()=>e.target.textContent='Готово!').catch(()=>{})});
 app.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>tx('play',{i:+e.dataset.i}))}
function sock(x,y,c,s,tl,t,sp,wig){cx.save();cx.translate(x,y);cx.rotate(tl);cx.scale(s,s);
 cx.fillStyle=c;cx.beginPath();cx.moveTo(-14,-34);cx.lineTo(10,-34);cx.lineTo(10,2);cx.quadraticCurveTo(14,6,26,6);cx.quadraticCurveTo(34,6,34,15);cx.quadraticCurveTo(34,24,24,24);cx.lineTo(-14,24);cx.closePath();cx.fill();
 cx.fillStyle='rgba(255,255,255,.6)';cx.fillRect(-14,-34,24,8);
 if(wig){cx.fillStyle='#f4efe6';cx.beginPath();cx.ellipse(-2,-36,18,9,0,Math.PI,0);cx.fill()}
 cx.fillStyle='#fff';cx.beginPath();cx.arc(-7,-16,5,0,7);cx.moveTo(9,-16);cx.arc(4,-16,5,0,7);cx.fill();
 cx.fillStyle='#111';cx.beginPath();cx.arc(-6,-15,2,0,7);cx.moveTo(7,-15);cx.arc(5,-15,2,0,7);cx.fill();
 cx.fillStyle='#5b1a1a';cx.beginPath();cx.ellipse(-1,-6,4,sp?2+Math.abs(Math.sin(t/90))*3:1,0,0,7);cx.fill();cx.restore()}
function wrap(s,n){const o=[];let l='';for(const w of s.split(' ')){if((l+' '+w).length>n){o.push(l);l=w}else l=l?l+' '+w:w}o.push(l);return o.slice(0,2)}
function draw(t){requestAnimationFrame(draw);cx.setTransform(2,0,0,2,0,0);cx.textAlign='center';
 cx.fillStyle='#26385a';cx.fillRect(0,0,360,240);cx.fillStyle='#4a3548';cx.fillRect(0,172,360,68);
 if(S){const lob=S.phase=='lobby',R=S.roles,P={},jur=[];
  const spk=S.phase=='trial'?(S.pending?S.pending.by:(S.turn%2?R.def:R.pro)):null;
  S.players.forEach(p=>{if(lob)jur.push(p);else if(p.id==R.pro)P[p.id]=[70,150,'Обвинение'];else if(p.id==R.def)P[p.id]=[290,150,'Защита'];else if(p.id==R.judge)P[p.id]=[180,90,'Судья'];else jur.push(p)});
  jur.forEach((p,i)=>P[p.id]=[360*(i+1)/(jur.length+1),lob?150:204,'']);
  S.players.forEach((p,i)=>{const[x,y]=P[p.id],jr=!P[p.id][2]&&!lob,s=jr?.7:1,sp=p.id==spk;
   sock(x,y+(sp?Math.sin(t/110)*3:Math.sin(t/700+i)*1.5),p.color,s,sp?Math.sin(t/140)*.1:0,t,sp,P[p.id][2]=='Судья')});
  if(!lob){cx.fillStyle='#9a6a40';cx.fillRect(128,102,104,24);cx.fillRect(42,152,56,26);cx.fillRect(262,152,56,26)}
  S.players.forEach(p=>{const[x,y,r]=P[p.id];cx.font='800 11px Rubik,sans-serif';cx.fillStyle='#f4efe6';
   cx.fillText(p.name,x,r=='Судья'?138:r?192:lob?186:234);if(r){cx.fillStyle='#f2b33d';cx.font='800 10px Rubik,sans-serif';cx.fillText(r,x,y-44)}});
  const c=S.phase=='trial'&&(S.pending||S.played[S.played.length-1]);
  if(c){const col=(S.players.find(p=>p.id==c.by)||{}).color;cx.fillStyle='#f7f3ff';cx.fillRect(6,3,348,34);cx.fillStyle=col;cx.fillRect(6,3,5,34);
   cx.fillStyle='#1c2942';cx.font='500 10.5px Rubik,sans-serif';cx.textAlign='left';wrap(nm(c.by)+': '+c.t,56).forEach((l,i)=>cx.fillText(l,16,17+i*13));cx.textAlign='center'}
  if(S.phase=='verdict'&&S.verdict){const g=S.verdict.guilty,w=g?'ВИНОВЕН':'НЕВИНОВЕН';cx.save();cx.translate(180,135);cx.rotate(-.15);cx.font='800 36px Rubik,sans-serif';
   cx.fillStyle=g?'#e4572e':'#4cb5ae';cx.strokeStyle='#fff';cx.lineWidth=4;cx.strokeText(w,0,0);cx.fillText(w,0,0);cx.restore()}
  const d=Date.now()-objAt;if(d<1600){cx.save();cx.translate(180+Math.sin(d/25)*3,125);cx.rotate(.1);cx.font='800 40px Rubik,sans-serif';
   cx.fillStyle='#e4572e';cx.strokeStyle='#fff';cx.lineWidth=5;cx.strokeText('ПРОТЕСТУЮ!',0,0);cx.fillText('ПРОТЕСТУЮ!',0,0);
   cx.font='800 12px Rubik,sans-serif';cx.fillStyle='#fff';cx.fillText(objBy,0,18);cx.restore()}}}
requestAnimationFrame(draw);render();
</script></body></html>
